name: Build Wheels

on:
  push:
    branches:
      - main
      - 'dev/**'
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - 'dev/**'

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_contract:
    name: Validate Python contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'

  build_wheels:
    name: Build wheels (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            platform: linux
            arch: x86_64
          - runs_on: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runs_on: windows-latest
            platform: windows
            arch: amd64
          - runs_on: windows-11-arm
            platform: windows
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build custom build image
        if: matrix.platform == 'linux'
        run: |
          docker build \
            -t custom-cuda-builder \
            --build-arg MANYLINUX_IMAGE=quay.io/pypa/manylinux2014_${{ matrix.arch }} \
            -f docker/cuda-on-manylinux.Dockerfile \
            .

      - name: Build Windows binaries
        if: matrix.platform == 'windows'
        env:
          VCVARS_ARCH: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
          DETOURS_TARGET_PROCESSOR: ${{ matrix.arch == 'amd64' && 'X64' || 'ARM64' }}
          DETOURS_LIB_DIR: C:/Detours/lib.${{ matrix.arch == 'amd64' && 'X64' || 'ARM64' }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH%

          if exist C:\Detours rmdir /s /q C:\Detours
          git clone --depth 1 https://github.com/microsoft/Detours.git C:\Detours
          pushd C:\Detours
          nmake
          popd

          del /q comfy_aimdo\*.dll 2>nul
          cl.exe /LD /O2 /DAIMDO_CUDA ^
            src/*.c src-cuda/dispatch.c src-win/*.c ^
            /Isrc /Isrc-win /IC:/Detours/include /FIcompiler.h /Fe:comfy_aimdo/aimdo.dll ^
            /link /LIBPATH:%DETOURS_LIB_DIR% ^
            cfgmgr32.lib dxgi.lib dxguid.lib setupapi.lib detours.lib onecore.lib
          cl.exe /LD /O2 /D__HIP_PLATFORM_AMD__ ^
            src/*.c src-hip/dispatch.c src-win/*.c ^
            /Isrc /Isrc-win /IC:/Detours/include /FIcompiler.h /Fe:comfy_aimdo/aimdo_rocm.dll ^
            /link /LIBPATH:%DETOURS_LIB_DIR% ^
            cfgmgr32.lib dxgi.lib dxguid.lib setupapi.lib detours.lib onecore.lib
        shell: cmd

      - name: Build default Stub Wheel
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: |
          pip install build
          rm -f comfy_aimdo/*.so comfy_aimdo/*.dll
          python -m build --wheel --outdir wheelhouse-none/

      - name: Upload Stub Wheel
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-none
          path: ./wheelhouse-none/*.whl

      - name: Pre-fetch virtualenv.pyz (Windows)
        if: matrix.platform == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\pypa\cibuildwheel\Cache\virtualenv-20.26.6.pyz"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $headers = @{ Authorization = "token $env:GH_TOKEN" }
          $url = "https://github.com/pypa/get-virtualenv/blob/20.26.6/public/virtualenv.pyz?raw=true"
          Invoke-WebRequest -Uri $url -OutFile $dest -Headers $headers -UseBasicParsing
          Write-Host "Downloaded virtualenv.pyz"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: custom-cuda-builder
          CIBW_MANYLINUX_AARCH64_IMAGE: custom-cuda-builder
          CIBW_BUILD: ${{ matrix.platform == 'linux' && format('cp39-manylinux_{0}', matrix.arch) || format('cp39-win_{0}', matrix.arch) }}
          CIBW_BEFORE_BUILD_LINUX: bash ./scripts/build-linux-aimdo.sh
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --exclude libcuda.so.1 -w {dest_dir} {wheel}"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  dinkster_publish:
    name: Publish Dinkster to PyPI
    needs: [build_wheels, release_contract]
    runs-on: ubuntu-latest
    if: github.repository == 'Kosinkadink/dinkster-aimdo' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download native wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*-*
          merge-multiple: true

      - name: Verify Dinkster wheel filenames
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "error: no wheels found" >&2
            exit 1
          fi
          printf '%s\n' "${wheels[@]}"
          for wheel in "${wheels[@]}"; do
            filename="${wheel##*/}"
            if [[ "$filename" != dinkster_aimdo-* ]]; then
              echo "error: unexpected wheel filename: $filename" >&2
              exit 1
            fi
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  dinkster_release:
    name: Publish Dinkster native wheel release
    needs: [build_wheels, release_contract]
    runs-on: ubuntu-latest
    if: github.repository == 'Kosinkadink/dinkster-aimdo' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*-*
          merge-multiple: true

      - name: Build hash-pinned manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/build_release_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$GITHUB_REF_NAME" \
            --version "$version" \
            --source-commit "$GITHUB_SHA" \
            --output "dist/dinkster_aimdo-${version}-manifest.json" \
            dist/*.whl

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(jq -r .isDraft release-state.json)" != "true" ]; then
              echo "error: release already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "dinkster-aimdo ${version}" \
              --notes "Dinkster native wheels and their hash-pinned manifest."
          fi

      - name: Upload and verify exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft > release-assets.json
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("release-assets.json").read_text())
          if release.get("isDraft") is not True:
              raise SystemExit("release must remain a draft until verification completes")
          local = {path.name: path.stat().st_size for path in Path("dist").iterdir() if path.is_file()}
          remote_entries = release.get("assets")
          if not isinstance(remote_entries, list):
              raise SystemExit("release asset metadata is invalid")
          remote = {entry.get("name"): entry.get("size") for entry in remote_entries}
          if len(remote) != len(remote_entries) or remote != local:
              raise SystemExit("release assets do not exactly match the verified local matrix")
          PY

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
